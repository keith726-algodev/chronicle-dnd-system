# Optional: only needed if you self-host the API and database yourself
# instead of using a managed host. Not required for the Render/Neon-style
# deployment the README describes.
#
#   docker compose up --build
#
# Then, separately, point the client's VITE_API_BASE_URL at wherever this
# is reachable, and run `npm run db:reset` once against it.

services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: chronicle
      POSTGRES_PASSWORD: devpassword
    volumes:
      - chronicle_pg_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  api:
    build: ./server
    restart: unless-stopped
    depends_on:
      - db
    environment:
      DATABASE_URL: postgresql://postgres:devpassword@db:5432/chronicle
      CORS_ORIGINS: http://localhost:5173
      NODE_ENV: production
      PORT: 3000
    ports:
      - "3000:3000"

volumes:
  chronicle_pg_data:
