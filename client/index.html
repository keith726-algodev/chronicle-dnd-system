<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chronicle — a campaign codex</title>
    <meta
      name="description"
      content="Chronicle: a personalized, branching note app for tabletop Dungeon Masters."
    />
    <!-- Pairs with public/404.html: restores the real path after GitHub
         Pages redirects a nested-route refresh back to this file. -->
    <script>
      (function () {
        var redirect = sessionStorage.redirect;
        delete sessionStorage.redirect;
        if (redirect && redirect !== location.href) {
          history.replaceState(null, "", redirect.replace(location.origin, ""));
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
